[project]
name = "pych9329"
version = "0.1.7"
description = "Python module to control the ch9329"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "wevsty", email = "ty@wevs.org" }
]
classifiers = [
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Repository = "https://github.com/wevsty/pych9329"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "pytest-datadir>=1.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"